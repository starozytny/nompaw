services:
  php:
    user: "${UID:-1000}:${GID:-1000}"
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: nompaw_php
    volumes:
      - ./:/var/www/nompaw:cached
      - composer_cache:/root/.composer
      - ./docker/php/php.ini:/usr/local/etc/php/php.ini
    environment:
      - DATABASE_URL=mysql://nompaw:nompaw@shared_mariadb:3306/nompaw?serverVersion=mariadb-11.4.9
    networks:
      - symfony
      - db_shared

  nginx:
    image: nginx:alpine
    container_name: nompaw_nginx
    volumes:
      - ./public:/var/www/nompaw/public:cached
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - symfony
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nompaw.rule=Host(`nompaw.local`)"
      - "traefik.http.routers.nompaw.entrypoints=websecure"
      - "traefik.http.routers.nompaw.tls=true"
      - "traefik.http.services.nompaw.loadbalancer.server.port=80"

  node:
    image: node:24.19.0-alpine
    container_name: nompaw_node
    working_dir: /var/www/nompaw
    volumes:
      - ./:/var/www/nompaw:cached
      - node_modules:/var/www/nompaw/node_modules
    command: sh -c "yarn install && chown -R ${UID:-1000}:${GID:-1000} /var/www/nompaw/node_modules && yarn watch"
    networks:
      - symfony

networks:
  symfony:
    driver: bridge
  proxy:
    external: true
  db_shared:
    external: true

volumes:
  composer_cache:
    external: true
    name: composer_cache_shared
  node_modules:
